[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Spec-driven multi-agent QA system: reads a PRD, drives a web app with Playwright, reports pass/fail/unverified with evidence."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "playwright>=1.48",
  "pydantic>=2.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "rich>=13.7",
  "tenacity>=8.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
qa-agent = "qa_agent.cli:app"

[tool.setuptools.packages.find]
include = ["qa_agent*"]

[tool.setuptools.package-data]
qa_agent = ["llm/prompts/*.md", "report_templates/*", "contracts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs the local target app running"]

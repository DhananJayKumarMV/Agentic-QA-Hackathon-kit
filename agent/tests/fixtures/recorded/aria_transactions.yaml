      - option "All types" [selected]
      - option "Deposit"
      - option "Withdrawal"
      - option "Transfer"
    - text: Status
    - combobox "Status":
      - option "All statuses" [selected]
      - option "Completed"
      - option "Pending"
      - option "Failed"
    - text: Start date
    - textbox "Start date"
    - text: End date
    - textbox "End date"

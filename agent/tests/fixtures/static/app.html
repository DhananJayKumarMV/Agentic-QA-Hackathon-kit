<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Static fixture</title></head>
<body>
  <header>
    <nav aria-label="Main">
      <a href="#home">Home</a>
      <a href="#list">Items</a>
    </nav>
    <button type="button" id="logout">Sign out</button>
  </header>
  <main id="main">
    <h1>Fixture page</h1>
    <section aria-label="Cards">
      <article class="card" data-testid="item-card"><h3>Primary</h3><span>Checking</span><p>$10.00</p></article>
      <article class="card" data-testid="item-card"><h3>Reserve</h3><span>Savings</span><p>$20.00</p></article>
    </section>
    <form aria-label="Send form" onsubmit="event.preventDefault(); document.getElementById('result').textContent = 'Sent ' + document.getElementById('amt').value;">
      <label for="src">From account</label>
      <select id="src">
        <option value="">Select an account</option>
        <option value="a1">Primary (1)</option>
        <option value="a2">Reserve (2)</option>
      </select>
      <label for="amt">Amount (USD)</label>
      <input id="amt" type="text" aria-describedby="amt-hint">
      <p id="amt-hint">Up to two decimal places.</p>
      <button type="submit" class="go">Send money</button>
    </form>
    <p id="result" role="status"></p>
    <div id="late"></div>
    <div id="busy" aria-busy="true">Working</div>
    <p id="fetched"></p>
  </main>
  <script>
    // Delayed loading state: "Loading…" for ~700ms, then content appears.
    const late = document.getElementById('late');
    late.innerHTML = '<div role="status"><span>Loading…</span></div>';
    setTimeout(() => { late.innerHTML = '<p data-testid="late-content">Loaded content</p>'; }, 700);
    setTimeout(() => { document.getElementById('busy').setAttribute('aria-busy', 'false'); }, 400);
    if (location.protocol.startsWith('http')) {
      fetch('slow.json?x=1').then(r => r.json()).then(d => { document.getElementById('fetched').textContent = d.message; });
    }
  </script>
</body>
</html>
